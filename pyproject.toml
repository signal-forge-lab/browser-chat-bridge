[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-chat-bridge"
version = "0.1.0"
description = "Run-scoped bridge from local callers to browser-hosted chat UIs"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["nodriver>=0.50.3,<0.51", "websockets>=15,<16"]

[project.scripts]
browser-chat-bridge = "browser_chat_bridge.bridge_server:main"
browser-chat-driver = "browser_chat_bridge.driver_server:main"
browser-chat-browser = "browser_chat_bridge.browser_server:main"

[tool.setuptools.packages.find]
where = ["src"]

